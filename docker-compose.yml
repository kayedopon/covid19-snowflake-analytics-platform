services:
  redis:
    image: redis:7-alpine
    container_name: covid-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  mongodb:
    image: mongo:latest
    container_name: covid-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: covid-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: covid_analytics
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    restart: unless-stopped

  dashboard:
    build: .
    container_name: covid-dashboard
    command: python -m src.visualization.dashboard
    ports:
      - "8050:8050"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mongodb_data:
